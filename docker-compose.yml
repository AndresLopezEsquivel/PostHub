# The development stack. It needs no setup:
#
#   docker compose up --build
#
# It is standalone. Production uses docker-compose.prod.yml instead.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Committed on purpose: they protect only this local database, so the stack
      # works with no setup. A root .env can override them.
      POSTGRES_USER: ${POSTGRES_USER:-posthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-posthub}
      POSTGRES_DB: ${POSTGRES_DB:-posthub}
    ports:
      - "5432:5432"
    volumes:
      - posthub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-posthub} -d ${POSTGRES_DB:-posthub}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      target: dev
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-posthub}:${POSTGRES_PASSWORD:-posthub}@db:5432/${POSTGRES_DB:-posthub}
      # Committed on purpose, like the database credentials: it only signs cookies
      # for local sessions.
      SESSION_SECRET: ${SESSION_SECRET:-dev-insecure-secret}
      # Empty by default, so uploads return 503 and posts show no images. Set them
      # in a root .env to try uploads locally.
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      UPLOAD_URL_TTL: ${UPLOAD_URL_TTL:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      # Keeps the image's node_modules from being hidden by the ./frontend bind
      # mount. After changing package.json, recreate it with --renew-anon-volumes.
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: development
      # Where the Vite dev server forwards /api. `api` is the Compose service name.
      # vite.config.ts explains why the variable has no VITE_ prefix.
      API_PROXY_TARGET: http://api:4000
    depends_on:
      - api

volumes:
  posthub_pgdata:
