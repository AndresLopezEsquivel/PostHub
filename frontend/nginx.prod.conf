# The same as nginx.conf, except that it terminates TLS on :443 instead of
# listening on :80. docker-compose.prod.yml mounts it over the image's nginx.conf.
#
# The certificate is self-signed, so browsers show a warning. Do not add HSTS
# while it is: browsers would cache the header and stop letting anyone click
# through the warning.

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text payloads only; images and fonts are already compressed.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite puts a content hash in every file name under /assets, so a changed file
    # gets a new URL and these can be cached forever.
    #
    # A missing asset returns 404 instead of index.html. Serving HTML in place of a
    # script hides the broken deploy behind an "unexpected token '<'" error.
    location /assets/ {
        # Not `expires`: it adds its own Cache-Control, so the response would carry two.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html is the only file without a hash, and it names the current asset
    # files. A cached copy would load the previous deploy's bundle.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # `api` is the Compose service name. nginx resolves it once at startup and fails
    # to start if it does not resolve, hence depends_on in docker-compose.prod.yml.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # $scheme is https here, because TLS terminates in this server block. Express
        # trusts this header in production (backend/src/app.ts), so it treats the
        # request as HTTPS and the secure session cookie is sent.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Cookies pass through unchanged. The browser sees the same origin and path
        # that nginx forwards, so the session cookie needs no proxy_cookie_* rewriting.
        proxy_read_timeout 60s;
    }

    # Every path outside /api/ belongs to React Router, so an unknown path returns
    # index.html with a 200 and the router shows its Not Found page. Without this,
    # refreshing /posts/42 would return 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
