# PostHub frontend — the deploy-only, TLS-terminating edge.
#
# This is frontend/nginx.conf with ONE difference: instead of listening on plain
# :80 and delegating TLS to an upstream (ALB/CloudFront), it terminates TLS here
# with a certificate. It is mounted over the image's baked-in default.conf by
# docker-compose.prod.yml, so the committed nginx.conf stays the upstream-TLS
# variant and nothing here has to change when a real ALB eventually fronts this.
#
# The cert is self-signed (generated on the instance) for a local prod-mode smoke
# test — browsers will warn; you click through. Swap in a CA-issued cert (Let's
# Encrypt via a domain, or move TLS to an ALB) for anything real. Do NOT add HSTS
# while the cert is self-signed: a cached Strict-Transport-Security header makes
# the click-through impossible to bypass later.
#
# Because TLS terminates HERE, $scheme is `https` for these requests, so the
# `X-Forwarded-Proto $scheme` line below forwards https to Express — which, with
# `trust proxy: 1` under NODE_ENV=production, is what makes req.secure true and
# lets express-session emit the `secure` posthub.sid cookie.

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text payloads only; images and fonts are already compressed.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints everything it emits into /assets (index-<hash>.js), so a
    # content change produces a new URL and these can be cached immutably and
    # never revalidated.
    #
    # =404 rather than falling through to index.html: a missing asset is a broken
    # deploy, and answering it with HTML would bury that under an "unexpected
    # token '<'" console error instead of a clean 404.
    location /assets/ {
        # One header, not two: nginx's `expires` directive emits its own
        # Cache-Control, so pairing it with add_header sends the field twice.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html is the one unhashed file — it names the current asset hashes, so
    # a cached copy boots the *previous* deploy's bundle. Never cache it.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The API. `api` is the docker-compose service name; nginx resolves it ONCE at
    # startup and refuses to start if it does not resolve (hence depends_on: [api]
    # on the web-prod service).
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # $scheme is `https` because TLS terminates in this server block, so
        # Express derives req.secure=true and express-session emits the secure
        # cookie. This is the whole reason self-signed TLS enables a true
        # NODE_ENV=production smoke test (plain :80 would forward http here).
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Cookies pass through untouched in both directions. No proxy_cookie_path
        # or proxy_cookie_domain rewriting is needed or wanted: the proxy preserves
        # both the origin and the path the browser already sees, so posthub.sid's
        # scope is already correct. It is httpOnly, so this is its only channel.
        proxy_read_timeout 60s;
    }

    # SPA history fallback. React Router owns every non-/api path, so an unknown
    # URL must return index.html with a 200 and let the router decide — including
    # rendering the Not Found screen from docs/screens.md.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
