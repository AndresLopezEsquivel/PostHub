# Serves the built app and proxies /api/ to the backend, so the browser talks to
# a single origin. That is why the backend needs no CORS setup and the session
# cookie stays first-party.
#
# It listens on plain :80, for a setup where TLS ends in front of it, such as a
# load balancer. docker-compose.prod.yml replaces it with nginx.prod.conf, which
# terminates TLS itself.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text payloads only; images and fonts are already compressed.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite puts a content hash in every file name under /assets, so a changed file
    # gets a new URL and these can be cached forever.
    #
    # A missing asset returns 404 instead of index.html. Serving HTML in place of a
    # script hides the broken deploy behind an "unexpected token '<'" error.
    location /assets/ {
        # Not `expires`: it adds its own Cache-Control, so the response would carry two.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html is the only file without a hash, and it names the current asset
    # files. A cached copy would load the previous deploy's bundle.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # `api` is the Compose service name. nginx resolves it once at startup and fails
    # to start if it does not resolve, hence depends_on in docker-compose.prod.yml.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # In production, Express trusts this header (backend/src/app.ts) to decide
        # whether the request was HTTPS, which the secure session cookie requires.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Cookies pass through unchanged. The browser sees the same origin and path
        # that nginx forwards, so the session cookie needs no proxy_cookie_* rewriting.
        proxy_read_timeout 60s;
    }

    # Every path outside /api/ belongs to React Router, so an unknown path returns
    # index.html with a 200 and the router shows its Not Found page. Without this,
    # refreshing /posts/42 would return 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
