# PostHub frontend — the production edge. Two jobs, deliberately only two:
#
#   1. Serve the built SPA, with a history fallback so client-side routes survive
#      a hard refresh or a shared deep link.
#   2. Reverse-proxy /api/ to the Express container, so the browser only ever
#      talks to one origin. That is what makes docs/api_design.md's "no host or
#      port appears in client code" true, and it is why the backend mounts no
#      CORS middleware and why posthub.sid stays a first-party cookie.
#
# It terminates no TLS and holds no application logic: TLS belongs upstream (an
# ALB, CloudFront, or whatever fronts this), and logic belongs in the API.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text payloads only; images and fonts are already compressed.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints everything it emits into /assets (index-<hash>.js), so a
    # content change produces a new URL and these can be cached immutably and
    # never revalidated.
    #
    # =404 rather than falling through to index.html: a missing asset is a broken
    # deploy, and answering it with HTML would bury that under an "unexpected
    # token '<'" console error instead of a clean 404.
    location /assets/ {
        # One header, not two: nginx's `expires` directive emits its own
        # Cache-Control, so pairing it with add_header sends the field twice.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html is the one unhashed file — it names the current asset hashes, so
    # a cached copy boots the *previous* deploy's bundle. Never cache it.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The API. `api` is the docker-compose service name; this is the one line to
    # change when the backend moves to an ECS service or a k8s Service DNS name.
    #
    # Caveat worth knowing before that day: nginx resolves this name ONCE at
    # startup and refuses to start if it does not resolve (hence depends_on: [api]
    # on the prod `web` service). In an orchestrator where the backend can be
    # replaced under a stable name, switch to a `resolver` directive plus a
    # variable — `set $upstream http://api:4000; proxy_pass $upstream;` — so the
    # name is re-resolved per request.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # backend/src/app.ts sets `trust proxy: 1` under NODE_ENV=production, so
        # Express reads these to derive req.secure — which is what actually lets
        # express-session emit the `secure` cookie over HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Cookies pass through untouched in both directions. No proxy_cookie_path
        # or proxy_cookie_domain rewriting is needed or wanted: the proxy preserves
        # both the origin and the path the browser already sees, so posthub.sid's
        # scope is already correct. It is httpOnly, so this is its only channel.
        proxy_read_timeout 60s;
    }

    # SPA history fallback. React Router owns every non-/api path, so an unknown
    # URL must return index.html with a 200 and let the router decide — including
    # rendering the Not Found screen from docs/screens.md.
    #
    # This CANNOT be delegated to the backend: notFoundHandler JSON-404s every
    # non-/api path, by design. SPA fallback is the frontend edge's job alone.
    # Without this line, a refresh on /posts/42 is a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
