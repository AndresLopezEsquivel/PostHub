# The production stack. It is standalone, not an override of docker-compose.yml,
# so it must always be named:
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Values come from the root .env (see .env.example). A ${VAR:?message} value stops
# the run with that message when the variable is missing.
services:
  api:
    build:
      context: ./backend
      target: production
    environment:
      NODE_ENV: production         # enables the secure cookie and trust proxy
      # Must match proxy_pass http://api:4000 in nginx.prod.conf.
      PORT: 4000
      # RDS requires TLS. backend/src/db/pool.ts explains the certificate setting.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the RDS endpoint in .env}
      DATABASE_SSL: "true"
      # Required here because backend/src/config/env.ts falls back to a dev secret
      # when SESSION_SECRET is unset.
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env (openssl rand -hex 32)}
      # Optional: while these are unset, uploads return 503 and posts show no images.
      # There are no AWS keys here on purpose: the EC2 instance role supplies them.
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      UPLOAD_URL_TTL: ${UPLOAD_URL_TTL:-}
    restart: unless-stopped
    # No host ports: the api is not reachable from the internet, only through nginx.

  web:
    build:
      context: ./frontend
      target: production
    ports:
      # The only published port. infra/network.tf also opens 22 for SSH.
      - "443:443"
    volumes:
      # Replaces the image's nginx.conf (plain :80, for TLS ending upstream) with the
      # version that terminates TLS on :443.
      - ./frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # The self-signed certificate and key, generated on the instance (see README.md).
      - ./certs:/etc/nginx/certs:ro
    # nginx resolves api:4000 once at startup and exits if the name does not
    # resolve, so the api container must exist first.
    depends_on:
      - api
    restart: unless-stopped
